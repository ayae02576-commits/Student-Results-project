<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نظام إدارة النتائج</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS File -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container mt-5">

        <!-- عنوان المشروع -->
        <h1 class="text-center mb-4">
            نظام إدارة نتائج الطلاب
        </h1>

        <!-- بيانات الطالب -->
        <div class="card p-4 shadow">

            <h3 class="mb-3">إضافة طالب جديد</h3>

            <!-- اسم الطالب -->
            <div class="mb-3">
                <label class="form-label">اسم الطالب</label>
                <input
                    type="text"
                    id="studentName"
                    class="form-control"
                    placeholder="اكتب اسم الطالب">
            </div>

            <!-- درجات المواد -->
            <div class="mb-3">
                <label class="form-label">درجة المادة الأولى</label>
                <input
                    type="number"
                    id="grade1"
                    class="form-control"
                    placeholder="أدخل الدرجة">
            </div>

            <div class="mb-3">
                <label class="form-label">درجة المادة الثانية</label>
                <input
                    type="number"
                    id="grade2"
                    class="form-control"
                    placeholder="أدخل الدرجة">
            </div>

            <div class="mb-3">
                <label class="form-label">درجة المادة الثالثة</label>
                <input
                    type="number"
                    id="grade3"
                    class="form-control"
                    placeholder="أدخل الدرجة">
            </div>

            <!-- نسبة الحضور -->
            <div class="mb-3">
                <label class="form-label">نسبة الحضور</label>
                <input
                    type="number"
                    id="attendance"
                    class="form-control"
                    placeholder="أدخل نسبة الحضور">
            </div>

            <!-- الأزرار -->
            <div class="d-flex gap-2">

                <button
                    id="addStudentBtn"
                    class="btn btn-primary">
                    إضافة طالب
                </button>

                <button
                    id="mercyBtn"
                    class="btn btn-success">
                    تفعيل لجنة الرأفة
                </button>

            </div>

        </div>

        <!-- صندوق رسائل الخطأ -->
        <div class="mt-4">
            <div id="errorBox"></div>
        </div>

        <!-- قائمة الطلاب -->
        <div class="card p-4 mt-4 shadow">

            <h3>قائمة الطلاب</h3>

            <div id="studentsBox">
                لا يوجد طلاب حتى الآن
            </div>

        </div>

        <!-- التقرير النهائي -->
        <div class="card p-4 mt-4 mb-5 shadow">

            <h3>التقرير النهائي للجنة الرأفة</h3>

            <div id="reportBox">
                التقرير سيظهر هنا
            </div>

        </div>

    </div>

    <!-- JavaScript File -->
    <script src="js/main.js"></script>

</body>
</html>
